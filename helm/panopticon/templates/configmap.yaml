{{- if .Values.agent.config -}}
{{- if not (kindIs "string" .Values.agent.config) -}}
{{- fail "agent.config must be a TOML string (use `config: |`)" -}}
{{- end -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "panopticon.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "panopticon.labels" . | nindent 4 }}
data:
  config.toml: |
    # Generated by Helm from values.agent.config
    {{- .Values.agent.config | nindent 4 }}
{{- end }}
