{{- if and .Values.rbac.create .Values.kubernetes.enabled -}}
---
# Read-only access for Kubernetes identity: pod IPs -> namespace/workload,
# ClusterIPs -> namespace/service.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "panopticon.fullname" . }}
  labels:
    {{- include "panopticon.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
{{- end }}
