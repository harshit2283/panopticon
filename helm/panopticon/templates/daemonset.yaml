---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "panopticon.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "panopticon.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "panopticon.selectorLabels" . | nindent 6 }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "panopticon.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "panopticon.serviceAccountName" . }}
      # The token is only needed for Kubernetes identity (pod/service
      # metadata); don't hand a privileged pod an API token it never uses.
      automountServiceAccountToken: {{ or .Values.kubernetes.enabled .Values.serviceAccount.automountToken }}
      # hostNetwork: TC classifiers attach to the node's interfaces.
      # hostPID: /proc/<pid>/root is used to find TLS libraries in other containers.
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "panopticon.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- range .Values.agent.interfaces }}
            - "--interface"
            - {{ . | quote }}
            {{- end }}
            - "--metrics-bind"
            - "{{ .Values.metrics.bindAddress }}:{{ .Values.metrics.port }}"
            {{- if .Values.agent.logEvents }}
            - "--log-events"
            {{- end }}
            {{- if .Values.export.hostPath }}
            {{- if .Values.export.jsonEvents }}
            - "--json-export"
            - "/var/lib/panopticon/events.jsonl"
            {{- end }}
            {{- if .Values.export.piiAuditLog }}
            - "--pii-audit-log"
            - "/var/lib/panopticon/pii-audit.jsonl"
            {{- end }}
            {{- if .Values.export.rawCapture }}
            - "--capture-raw"
            - "/var/lib/panopticon/raw.pncap"
            {{- end }}
            {{- end }}
            {{- if .Values.agent.config }}
            - "--config"
            - "/etc/panopticon/config.toml"
            {{- end }}
          env:
            - name: RUST_LOG
              value: {{ .Values.agent.logLevel | quote }}
            {{- if not .Values.kubernetes.enabled }}
            - name: PANOPTICON_KUBERNETES
              value: "false"
            {{- end }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # /readyz turns 200 once eBPF programs are attached (independent of
          # traffic volume) and 503 once shutdown begins.
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
            # Tracepoint attachment (sched_process_exec/exit) needs tracefs.
            - name: tracefs
              mountPath: /sys/kernel/tracing
            - name: debugfs
              mountPath: /sys/kernel/debug
            {{- if .Values.agent.config }}
            - name: config
              mountPath: /etc/panopticon
              readOnly: true
            {{- end }}
            {{- if .Values.export.hostPath }}
            - name: export
              mountPath: /var/lib/panopticon
            {{- end }}
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: DirectoryOrCreate
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: DirectoryOrCreate
        {{- if .Values.agent.config }}
        - name: config
          configMap:
            name: {{ include "panopticon.fullname" . }}-config
        {{- end }}
        {{- if .Values.export.hostPath }}
        - name: export
          hostPath:
            path: {{ .Values.export.hostPath }}
            type: DirectoryOrCreate
        {{- end }}
